name: CI

on:
  pull_request:
    branches: [main]
  # Invocado por deploy.yml (push a main y re-deploy manual). El deploy queda
  # detrás de estas mismas verificaciones sin que main las corra dos veces, y
  # sin que `deploy-production` aparezca como check "Skipped" en cada PR.
  workflow_call:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm lint

      - run: pnpm exec tsc --noEmit

      - run: pnpm test

      - run: pnpm build
